<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>{% include head.html %}</head>
  <body data-bs-spy="scroll" data-bs-target="#topnav" data-bs-root-margin="-20% 0px -60%">
    <a class="skip-link" href="#main">Skip to content</a>
    {% include nav.html %}
    <main id="main">{{ content }}</main>
    <button id="backToTop" class="btn btn-dark position-fixed" aria-label="Back to top" hidden>
      <i class="bi bi-arrow-up" aria-hidden="true"></i>
    </button>
    <footer class="py-5 bg-dark text-light">
      <div class="container small d-flex flex-column flex-lg-row gap-3 justify-content-between">
        <div>© 2026 {{ site.title }}</div>
        <a class="link-light" href="mailto:{{ site.data.event.contact_email }}">Contact: {{ site.data.event.contact_name }}</a>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
  </body>
</html>
