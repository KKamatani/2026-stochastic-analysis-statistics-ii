yano:
  name: "Shota Yano"
  affiliation: "The University of Tokyo"
  title: "Invariant Measures as Estimators"
  abstract: "We present a general framework for statistical estimation based on invariant probability measures of Markov processes. The framework encompasses classical Z- and Bayes-type estimators and provides a unified approach to second-order stochastic expansions and bias correction.

The starting point is the decomposition of generators of Langevin diffusions used in Bayesian MCMC into a data-dependent vector field given by the gradient of the log-likelihood and a fixed diffusion operator incorporating the prior. We extend this construction by allowing a general random vector field as statistical input and considering invariant probability measures of Markov processes generated by its sum with a fixed diffusion operator. Given a loss function, we define the corresponding estimator as a decision minimizing the average loss under an invariant probability measure.

This formulation includes several familiar estimation procedures. When the diffusion operator vanishes, Dirac measures concentrated at zeros of the random vector field are invariant, yielding Z-estimators. In particular, maximum likelihood estimators are recovered when the vector field is the likelihood score. Beyond these cases, the statistical input need not be a gradient, the diffusion operator need not have an interpretation in terms of a prior, and the invariant probability measure need not be explicitly available.

Under suitable regularity and localization assumptions, we derive second-order stochastic expansions for averages of fixed smooth functions under invariant probability measures and for smooth functions evaluated at the associated decisions. The resulting expansions distinguish the contributions of the statistical input, the diffusion operator, and the loss function.

We then investigate bias reduction within this framework. For every bounded smooth function, we characterize by necessary and sufficient conditions when the difference between its invariant-measure average and its value at the corresponding decision estimates the leading frequentist bias of the latter. For a given loss function and statistical input, these conditions uniquely specify the diffusion operator. Consequently, the invariant probability measure provides a mechanism analogous to bootstrap sampling for estimating the bias of functions of the decision.

In the likelihood-score setting, two consequences are obtained. With squared Fisher–Rao distance as the loss, the conditions lead to a diffusion operator for which the corresponding Markov process admits the Jeffreys posterior as an invariant probability measure. The associated decision is its Fisher–Rao Fréchet mean. With squared Euclidean distance in fixed coordinates, the conditions instead yield a diffusion process determined entirely by the likelihood score and Fisher information. The mean of the parameter with respect to its invariant probability measure has no second-order frequentist bias in these coordinates.

The expansions admit intrinsic expressions in terms of connections, extending Amari's second-order expansion for maximum likelihood estimators in exponential families. Their first-order structure also generalizes the asymptotic theory of maximum likelihood and Bayes-type estimators developed in Ibragimov–Has'minskii theory and quasi-likelihood analysis. Moreover, Firth's adjusted scores, bias-reducing priors, and adjustments to estimating equations are recovered as special cases."
shiotani:
  name: "Takaaki Shiotani"
  affiliation: "The University of Tokyo"
  title: "On lead-lag estimation of non-synchronously observed point processes"
  abstract: "This paper introduces a new theoretical framework for analyzing lead-lag relationships between point processes, with a special focus on applications to high-frequency financial data. In particular, we are interested in lead-lag relationships between two sequences of order arrival timestamps. The seminal work of Dobrev and Schaumburg proposed model-free measures of cross-market trading activity based on cross-counts of timestamps. While their method is known to yield reliable results, it faces limitations because its original formulation inherently relies on discrete-time observations, an issue we address in this study. Specifically, we formulate the problem of estimating lead-lag relationships in two point processes as that of estimating the shape of the cross-pair correlation function (CPCF) of a bivariate stationary point process, a quantity well-studied in the neuroscience and spatial statistics literature. Within this framework, the prevailing lead-lag time is defined as the location of the CPCF's dominant peak. Under this interpretation, the peak location in Dobrev and Schaumburg's cross-market activity measure can be viewed as an estimator of the lead-lag time in the aforementioned sense. We further propose an alternative lead-lag time estimator based on kernel density estimation and show that it possesses desirable theoretical properties and delivers superior numerical performance. Empirical evidence from high-frequency financial data demonstrates the effectiveness of our proposed method."
ning:
  name: "Boyuan Ning"
  affiliation: "Waseda University"
  title: "Elasticity estimation via the CKLS--CIR transform for small-noise CEV-type diffusions"
  abstract: | 
    We construct a feasible two-step estimator for the elasticity parameter in small-noise CEV-type diffusions. Under joint small-noise and high-frequency asymptotics, we establish its consistency and an $$\varepsilon^{-1}$$ central limit theorem with an explicit asymptotic variance. We adapt a Lamperti-based transformation strategy to elasticity inference for a CEV process with an attainable, absorbing $$0$$ boundary. Under a local-to-CEV scaling, an auxiliary CKLS process and a Girsanov change of measure yield a strictly positive CIR-type benchmark in which the elasticity is recast as a linear-drift parameter. A preliminary elasticity estimator based on local realized variance supplies the unknown parameter in the state mapping, yielding a feasible LSE-type estimator. The asymptotic theory combines control of the CKLS-to-CEV path-replacement error, total-variation closeness between the original and changed measures, and asymptotic negligibility of the preliminary plug-in error, thereby transferring the auxiliary CIR limit theory to the feasible estimator under the original measure.
